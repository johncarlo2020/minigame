<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lights Out — 10 Move Challenge</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#101722;--line:#263244;--muted:#8996a9;--text:#f4f7fb;--amber:#ffb517;--blue:#80bfff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 8%,#1a293b,#0a1019 45%,#05070b)}.game{width:min(720px,100%);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#151f2cf5,#0a0f17fa);box-shadow:0 24px 70px #0008}.top{display:flex;justify-content:space-between;align-items:center;padding:24px 28px 20px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:13px;align-items:center}.icon{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;color:#15100a;background:var(--amber);box-shadow:0 0 25px #ffb51744;font-size:20px}h1{margin:0;font-size:18px}.sub{margin:3px 0 0;font-size:12px;color:var(--muted)}button{font:inherit}.help,.reset{color:#b9c4d4;background:none;border:0;cursor:pointer}.help:hover,.reset:hover{color:#fff}main{padding:28px}.stats{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:26px}.stat:last-child{text-align:right}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.value{margin-top:4px;font-size:26px;font-weight:750}.value span{color:var(--amber)}.status{padding:8px 14px;border-radius:999px;color:#dbe8f9;background:#1b2a3e;border:1px solid #2a415d;font-size:12px;font-weight:650}.boardWrap{display:grid;place-items:center;padding:18px 0 22px}.board{display:grid;grid-template-columns:repeat(5,minmax(42px,72px));gap:8px;padding:10px}.cell{aspect-ratio:1;border:1px solid #34445b;border-radius:7px;background:linear-gradient(145deg,#182231,#111925);cursor:pointer;box-shadow:inset 0 1px #ffffff0a,0 4px 10px #0003;transition:.15s}.cell:hover{transform:translateY(-2px);border-color:#6b7f9d}.cell:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.cell.on{border-color:#ffc12e;background:radial-gradient(circle at 40% 34%,#ffe07c,#ffbd18 52%,#f09b00);box-shadow:0 0 20px #ffb51790,inset 0 1px #fff8}.hint{text-align:center;color:#aab6c7;font-size:13px;line-height:1.5;margin:0 0 26px}.hint strong{color:#f5f7fa}.progress{height:7px;background:#1b2735;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#e98900,#ffcf55);transition:width .25s}.footer{display:flex;justify-content:space-between;margin-top:10px;color:#738196;font-size:11px}.modal{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#030508aa;backdrop-filter:blur(5px)}.modal[hidden]{display:none}.dialog{width:min(380px,100%);padding:28px;text-align:center;border:1px solid #31435c;border-radius:16px;background:#121c29;box-shadow:0 20px 60px #000b}.dialog h2{margin:0 0 8px}.dialog p{color:#b5c0cf;margin:0 0 22px;line-height:1.5;font-size:14px}.primary{border:0;border-radius:9px;padding:11px 18px;color:#1b1303;background:var(--amber);font-weight:750;cursor:pointer}.primary:hover{background:#ffd264}@media(max-width:520px){body{padding:10px}.top,main{padding-left:18px;padding-right:18px}.stats{grid-template-columns:1fr 1fr;gap:18px}.status{grid-column:1/-1;grid-row:2;justify-self:center}.board{gap:6px;padding:5px}}
</style></head>
<body><section class="game" aria-label="Lights Out game"><header class="top"><div class="brand"><div class="icon" aria-hidden="true">☼</div><div><h1>Lights Out</h1><p class="sub">10 move challenge</p></div></div><button class="help" id="help" type="button">How to play</button></header><main><div class="stats"><div class="stat"><div class="label">Round</div><div class="value" id="round">01</div></div><div class="status" id="status" role="status">Power down every light</div><div class="stat"><div class="label">Moves left</div><div class="value"><span id="moves">10</span> / 10</div></div></div><div class="boardWrap"><div class="board" id="board" role="grid" aria-label="5 by 5 Lights Out board"></div></div><p class="hint">A tap toggles that light and its <strong>up, down, left, and right</strong> neighbors.<br>Turn them all off before your moves run out.</p><div class="progress" aria-label="Moves used"><i id="progress"></i></div><div class="footer"><span id="best">Best: —</span><button class="reset" id="reset" type="button">↻ Reset round</button></div></main></section><div class="modal" id="modal" hidden><div class="dialog"><h2 id="modalTitle"></h2><p id="modalText"></p><button class="primary" id="modalButton" type="button">Play again</button></div></div>
<script>
const S=5,LIMIT=10,$=id=>document.getElementById(id);let cells=[],moves=0,round=0,seedMoves=0;
function flip(r,c){if(r>=0&&r<S&&c>=0&&c<S)cells[r*S+c]=!cells[r*S+c]}function press(r,c){[[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([a,b])=>flip(a,b))}
function puzzle(){cells=Array(25).fill(false);let last=-1;seedMoves=5+Math.floor(Math.random()*4);for(let i=0;i<seedMoves;i++){let n;do n=Math.floor(Math.random()*25);while(n===last);last=n;press(Math.floor(n/S),n%S)}if(cells.every(v=>!v))puzzle()}
function render(){let html='';cells.forEach((on,i)=>html+=`<button class="cell${on?' on':''}" type="button" role="gridcell" aria-label="Row ${Math.floor(i/S)+1}, column ${i%S+1}, ${on?'on':'off'}" aria-pressed="${on}" data-i="${i}"></button>`);$('board').innerHTML=html;$('moves').textContent=LIMIT-moves;$('progress').style.width=`${moves/LIMIT*100}%`}
function finish(won){$('status').textContent=won?'Grid cleared!':'Out of moves';$('modalTitle').textContent=won?'Lights out!':'So close';$('modalText').textContent=won?`You cleared the grid in ${moves} move${moves===1?'':'s'}.`:'The lights stayed on, but every round has a new solution.';$('modalButton').textContent=won?'Next round':'Try again';$('modal').hidden=false;if(won){let best=Number(localStorage.getItem('lightsOutBest')||999);if(moves<best){localStorage.setItem('lightsOutBest',moves);$('best').textContent=`Best: ${moves} moves`}}}
function move(i){if(moves>=LIMIT||cells.every(v=>!v))return;press(Math.floor(i/S),i%S);moves++;render();if(cells.every(v=>!v))finish(true);else if(moves===LIMIT)finish(false)}
function newRound(){$('modal').hidden=true;round++;moves=0;puzzle();$('round').textContent=String(round).padStart(2,'0');$('status').textContent='Power down every light';render()}
$('board').addEventListener('click',e=>{if(e.target.dataset.i!==undefined)move(Number(e.target.dataset.i))});$('reset').onclick=newRound;$('modalButton').onclick=newRound;$('help').onclick=()=>{$('modalTitle').textContent='How to play';$('modalText').textContent='Tap a tile to toggle it and the four tiles directly beside it. Clear all 25 lights in 10 moves or fewer.';$('modalButton').textContent='Got it';$('modalButton').onclick=()=>{$('modal').hidden=true;$('modalButton').onclick=newRound};$('modal').hidden=false};let best=Number(localStorage.getItem('lightsOutBest')||0);if(best)$('best').textContent=`Best: ${best} moves`;newRound();
</script></body></html>
